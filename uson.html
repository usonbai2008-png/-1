<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./uson.css">
    
    <title>Кыргыз Дүкөн | Кирүү</title>
</head>
<body>
    
  <div class="login-box">
    <div class="logo">👜 Кыргыз Дүкөн</div>

    <h1>Кош келиңиз!</h1>
    <p>Кош келиңиз!</p>


    <form id="loginForm">
      <label for="email">Электрондук почта</label>
      <input
        type="email"
        id="email"
        placeholder="example@gmail.com"
        required
      >


      <label for="password">Сыр сөз</label>
      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Сыр сөзүңүз"
          required
        >
        <button type="button" id="showPassword">👁</button>
      </div>

      <button class="login-btn" type="submit">
        ➜ Кирүү
      </button>
    </form>

     <p id="message" role="status"></p>
     

     <div class="register">
      Аккаунтуңуз жокпу?
      <a href="#" id="registerLink">Катталуу</a>
     </div>

     <div class="ornament">❦ ❦ ❦</div>
  </div>
     
  
  <script src="app.js" defer></script>
  </body>
</body>
</html>
